# Retain supplied kernel-patch and serving-probe formatting. Maintained helpers
# and their CPU tests are linted with the rest of runtime/.
extend-exclude = [
    "runtime/deepseek-v41-gb10/patches",
    "runtime/deepseek-v41-gb10/tools/verify5.py",
    "runtime/deepseek-v41-gb10/tools/test_engram_packed.py",
]

[lint.per-file-ignores]
# These source-bound compatibility imports are retained verbatim by their
# transport manifest and protected baseline fixture inventories.
"integrations/vllm/rocenante_prepared/roce/roce_oneshot.py" = ["F401"]
"runtime/images/upgrades/checks/kda_baseline/reference_helpers.py" = ["F401"]
# The pinned upstream QSA fixture contains an unused diagnostic allocation;
# its bytes are part of the release's reference-fixture identity.
"runtime/releases/shared-2026.09.0-rc.1/qualification/fixtures/tests/attention/test_qsa_contract.py" = ["F841"]
# The decode A/B record binds this benchmark program by SHA-256
# (decode-ab-20260925.json). Its CUDA-graph timing lambdas run inside each
# module-level loop iteration, before that iteration deletes `weights`. Ruff
# analyses the lambda bodies after the module-level `del weights` and reports
# `weights` inside them as an undefined name (F821).
"performance/records/qwen38-flash-next/decode-ab-20260925/bench_skinny.py" = ["F821"]
