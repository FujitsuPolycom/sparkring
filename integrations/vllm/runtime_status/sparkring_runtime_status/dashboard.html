<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>%%TITLE%%</title>
<style>
:root{color-scheme:dark;--bg:#10151c;--panel:#19212c;--line:#2d3949;--text:#e5edf7;--muted:#a1b0c3;--accent:#84d8c4;--warn:#ffd181;--bad:#ffa6ae}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}main,.toolbar,.connection{max-width:1240px;margin:auto;padding:0 28px}.toolbar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding-top:22px;padding-bottom:18px;border-bottom:1px solid var(--line)}a{color:var(--accent)}button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 14px;cursor:pointer}button:hover{border-color:var(--accent)}button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:4px}label{display:flex;gap:7px;align-items:center}.toolbar small{margin-left:auto;color:var(--muted)}.connection{color:var(--warn);padding-top:12px}.connection:empty{display:none}header{padding:30px 0 20px}.eyebrow{color:var(--accent);font-size:11px;font-weight:700;letter-spacing:.15em;margin:0 0 10px}h1{font-size:clamp(22px,3vw,32px);font-weight:650;letter-spacing:-.03em;line-height:1.25;overflow-wrap:anywhere;margin:0 0 10px}.subtitle{margin:0;color:var(--muted);overflow-wrap:anywhere}.subtitle span{padding:0 10px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;background:var(--panel)}.card span,.card small{display:block;color:var(--muted)}.card strong{display:block;font-size:30px;line-height:1.4;font-weight:600}.card .good{color:var(--accent)}.card .warn{color:var(--warn)}.notice{padding:13px 16px;background:#15262b;border-left:3px solid var(--accent);border-radius:4px;color:#b9d8d6;font-size:13px;margin:20px 0}.group{border:1px solid var(--line);border-radius:10px;margin:14px 0;background:var(--panel);overflow:hidden}.group>summary{cursor:pointer;padding:16px 18px;font-weight:600}.group>summary span{float:right;color:var(--muted);font-weight:400;font-size:12px}.table-scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px;text-align:left}thead{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}th,td{padding:12px 18px;border-top:1px solid var(--line);vertical-align:top}tbody th{font-weight:500;min-width:180px}td{overflow-wrap:anywhere;max-width:330px}td:nth-child(2),td:nth-child(3){font-family:ui-monospace,Consolas,monospace}.evidence{font-size:11px;color:var(--muted);white-space:nowrap}.rank-detail summary{cursor:pointer;white-space:nowrap}.rank-detail ul{padding-left:18px;font-size:12px;color:var(--muted);min-width:160px}.comparison{display:block}.bad .comparison,.bad .rank-detail>summary{color:var(--bad)}.warn .comparison,.warn .rank-detail>summary{color:var(--warn)}dl{display:grid;grid-template-columns:160px 1fr;gap:12px;padding:0 18px 18px;margin:0;font-size:13px}dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere;font-family:ui-monospace,Consolas,monospace}footer{color:var(--muted);padding:14px 0 30px;font-size:12px}.outdated{opacity:.7}noscript{display:block;text-align:center;padding:10px;color:var(--warn)}
.section-links{display:flex;flex-wrap:wrap;gap:10px 24px;font-size:13px}.section-note{margin:0;padding:0 18px 14px;color:var(--muted);font-size:12px;max-width:1000px}.legend{color:var(--muted);font-size:12px}.evidence[title]{cursor:help;text-decoration:underline dotted;text-underline-offset:3px}#links table,#communicators table,#nodes table{min-width:870px}#libraries td:last-child{font-family:ui-monospace,Consolas,monospace;max-width:720px}#versions td{white-space:nowrap}
@media(max-width:700px){main,.toolbar,.connection{padding-left:14px;padding-right:14px}.cards{grid-template-columns:1fr}.card{padding:12px 16px}.card strong{font-size:25px}.group>summary span{float:none;display:block;margin-top:3px}th,td{padding:10px 12px}.toolbar small{margin-left:0}dl{grid-template-columns:1fr;gap:4px}dd{margin-bottom:10px}}
</style></head><body>
<nav class="toolbar" aria-label="Status controls"><button id="refresh" type="button">Refresh now</button><label><input id="auto" type="checkbox" checked>Auto refresh · 5s</label><a href="../status.txt">Plain text</a><a href="../status">JSON</a><small id="updated">Server snapshot</small></nav>
<div id="connection" class="connection" role="status" aria-live="polite"></div>
<noscript>Automatic refresh requires JavaScript. Reload this page for a new snapshot.</noscript>
%%REPORT%%
<script>
(() => {
  const auto = document.getElementById('auto');
  const refresh = document.getElementById('refresh');
  const message = document.getElementById('connection');
  let timer = null;
  let controller = null;
  function schedule() {
    clearTimeout(timer);
    if (auto.checked && !document.hidden) timer = setTimeout(update, 5000);
  }
  async function update() {
    if (controller) return;
    clearTimeout(timer);
    controller = new AbortController();
    const timeout = setTimeout(() => controller?.abort(), 10000);
    refresh.disabled = true;
    try {
      const response = await fetch(window.location.href, {cache:'no-store', credentials:'same-origin', signal:controller.signal});
      if (!response.ok) throw new Error(response.status === 401 || response.status === 403 ? 'Authentication required.' : 'Server returned HTTP ' + response.status + '.');
      const html = await response.text();
      const page = new DOMParser().parseFromString(html, 'text/html');
      const report = page.getElementById('report');
      if (!report) throw new Error('Unexpected status response.');
      const open = new Map(Array.from(document.querySelectorAll('#report details[id]'), el => [el.id, el.open]));
      report.querySelectorAll('details[id]').forEach(el => {if (open.has(el.id)) el.open = open.get(el.id);});
      document.getElementById('report').replaceWith(report);
      document.title = page.title;
      message.textContent = '';
      document.getElementById('updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
    } catch (error) {
      message.textContent = (error.name === 'AbortError' ? 'Refresh timed out.' : error.message) + ' Showing the previous snapshot.';
      document.getElementById('report').classList.add('outdated');
    } finally {
      clearTimeout(timeout);
      controller = null;
      refresh.disabled = false;
      schedule();
    }
  }
  refresh.addEventListener('click', update);
  auto.addEventListener('change', schedule);
  document.addEventListener('visibilitychange', schedule);
  window.addEventListener('pagehide', () => {clearTimeout(timer); controller?.abort();});
  schedule();
})();
</script></body></html>
