name: Bug or setup problem
description: Report incorrect behavior, a regression, or a setup failure.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting the problem. Share what you have; Spark hardware and a complete evidence bundle are not required. Remove credentials and private site identifiers from logs.

  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Include what you expected and what happened instead.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: SparkRing version and profile
      description: Package version from `dpkg-query -W sparkring` (it ends in the source commit), or the commit or tag of a checkout, and the exact profile ID from `sparkring models`, if known.

  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      description: Provide the shortest commands or steps you have.

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Add relevant node count, hardware, OS, drivers, image, model, or configuration. For installer problems, include Docker's image store from `docker info --format '{{json .DriverStatus}}'`. Omit anything unavailable.

  - type: textarea
    id: logs
    attributes:
      label: Logs or other evidence
      description: Paste sanitized output or attach evidence if available. For the installer, `/var/log/sparkring/install.log` and `sudo sparkring status --refresh --json` help; both contain host names and private addresses.
      render: shell
