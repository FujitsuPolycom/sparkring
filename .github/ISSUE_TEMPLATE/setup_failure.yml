name: Bring-up or validation failure
description: Report a failure in a supported profile setup or validation path.
title: "[setup] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report the failing interface, command, and evidence for one of the two
        supported serving configurations:
        - GLM-5.2 EXL3 3.5-bpw with the R7 runtime and site/candidate contracts.
        - DeepSeek-V4-Flash-0731 with the published serving image and per-rank environment contract.

        This repository does not use numbered setup stages. Redact site identity
        from every log, JSON, and command: use RFC 5737 addresses, placeholder
        hostnames and paths, and never include credentials.

  - type: dropdown
    id: profile
    attributes:
      label: Supported profile
      options:
        - GLM-5.2 EXL3 3.5-bpw — R7 runtime
        - DeepSeek-V4-Flash-0731 — published serving image
        - Neither profile — offline tooling or documentation
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Status of the affected behavior
      options:
        - implemented
        - qualified
        - research-only
        - unsupported
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Hardware or network prerequisites
        - GLM-5.2 EXL3 R7 runtime build or image
        - DeepSeek-V4-Flash-0731 image or per-rank environment
        - Site or candidate configuration contract
        - Four-rank live serving validation
        - Offline Python validation
        - Documentation or repository tooling
        - Other / not sure
    validations:
      required: true

  - type: checkboxes
    id: sanitized
    attributes:
      label: Sanitization and authorization
      options:
        - label: I redacted IPs, hostnames, accounts, absolute host paths, credentials, and private image names.
          required: true
        - label: I had explicit authorization for any MUTATES HOST or STOPS SERVING action on the named hosts.
          required: true

  - type: input
    id: identity
    attributes:
      label: Exact release, commit, image, and model identity
      description: Use the identifiers relevant to the affected profile; do not write "latest".
    validations:
      required: true

  - type: textarea
    id: conditions
    attributes:
      label: Conditions
      description: State node count, rank layout, topology, software versions, and relevant environment values without private identifiers.
      value: |
        - Nodes and ranks:
        - Topology:
        - OS / kernel:
        - Driver / CUDA / RDMA:
        - Container engine:
        - Image and model identity:
        - Relevant environment:
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Exact command
      description: Paste the redacted command, including its working directory.
      render: shell
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: Observed result
      description: Include the complete failing output and exit code.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result and surviving path
      description: Name the current repository path or contract that defines the expectation. Do not refer to deleted setup-stage documents.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Attach machine-readable validation output or write "n/a" with the reason. State conditions, measurement, result, conclusion, and limitations.
      render: json

  - type: textarea
    id: tried
    attributes:
      label: What you already tried
