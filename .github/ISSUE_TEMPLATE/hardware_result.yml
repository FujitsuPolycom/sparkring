name: Four-rank hardware result
description: Report measured transport or serving behavior for a supported profile.
title: "[hardware] "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for four-rank live validation of either supported
        configuration. Negative results are valid. Redact site identity before
        posting: use RFC 5737 addresses, placeholder hostnames and paths, and
        never include accounts, credentials, or private image names.

  - type: dropdown
    id: profile
    attributes:
      label: Supported profile
      options:
        - GLM-5.2 EXL3 3.5-bpw — R7 runtime
        - DeepSeek-V4-Flash-0731 — published serving image
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Result status
      options:
        - implemented
        - qualified
        - research-only
        - unsupported
    validations:
      required: true

  - type: checkboxes
    id: sanitized
    attributes:
      label: Sanitization and authorization
      options:
        - label: I redacted IPs, hostnames, accounts, absolute host paths, credentials, and private image names.
          required: true
        - label: I had explicit authorization for any MUTATES HOST or STOPS SERVING action on the named hosts.
          required: true

  - type: textarea
    id: conditions
    attributes:
      label: Conditions
      description: State node count, rank layout, topology, image/model identity, drivers, and relevant environment values without private identifiers.
      value: |
        - Nodes and ranks:
        - Topology:
        - Image and model identity:
        - Driver / CUDA / RDMA versions:
        - Relevant environment:
    validations:
      required: true

  - type: textarea
    id: measurements
    attributes:
      label: Measurements
      description: Include units, per-rank or per-edge results, request errors, and integrity counters.
      render: text
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Exact validation command
      description: Paste the redacted command and exit code.
      render: shell
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence artifact
      description: Attach immutable JSON from performance/records/ or the applicable validation output. State limitations.
      render: json
    validations:
      required: true

  - type: textarea
    id: conclusion
    attributes:
      label: Conclusion
      description: State the result, qualification decision, and what would make the result unsupported.
    validations:
      required: true
