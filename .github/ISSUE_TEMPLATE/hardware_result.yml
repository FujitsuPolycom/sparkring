name: Hardware / cable result
description: Report what a topology, cable, or NIC combination actually did — success or failure.
title: "[hardware] "
body:
  - type: markdown
    attributes:
      value: |
        Use this to report **measured hardware behaviour**: a cable that
        qualified, a cable that did not, a NIC or transceiver combination that
        worked or did not, a topology other than the four-node ring.

        Negative results are as valuable as positive ones. "This QSFP module
        never reached 200 Gb/s on both ports" is a result worth recording.

        **Public repository — redact before pasting:** IP addresses (use RFC
        5737 ranges), hostnames, SSH accounts, and absolute host paths.
        ConnectX-7 / RoCE interface names are fine; they are identical on
        every DGX Spark.

  - type: checkboxes
    id: sanitized
    attributes:
      label: Sanitization
      options:
        - label: I have redacted IPs, hostnames, accounts, and absolute host paths.
          required: true

  - type: dropdown
    id: outcome
    attributes:
      label: Outcome
      options:
        - "Qualified — all edges passed"
        - "Partially qualified — some edges passed, some did not"
        - "Failed — cable/PHY integrity"
        - "Failed — configuration (link speed, MTU, GID, routing)"
        - "Passed integrity but missed the latency target"
        - "Could not run the qualification at all"
    validations:
      required: true

  - type: textarea
    id: topology
    attributes:
      label: Topology
      description: >-
        Node count, how they are cabled, and whether a switch is involved.
        Draw it if that is easier. State explicitly whether cable ends are
        cage-matched.
      value: |
        - Node count:
        - Cabling:        (e.g. ring 0-1-2-3-0, one direct link per edge)
        - Switch?:        (none / model)
        - Cage-matched:   (yes / no / unknown)
    validations:
      required: true

  - type: textarea
    id: hardware
    attributes:
      label: Hardware under test
      value: |
        - Node model:
        - NIC model + firmware:
        - Cable/transceiver: (DAC or AOC, vendor, part number, length)
        - Driver / OFED / rdma-core versions:
    validations:
      required: true

  - type: textarea
    id: edges
    attributes:
      label: Per-edge measurements
      description: >-
        One row per directed or undirected edge. Speed as reported by the
        link, MTU as configured, GID index used for RoCEv2, and the p50/p99
        the qualification reported. Mark any edge that failed.
      value: |
        | Edge | Port speed | MTU | GID idx | p50 (us) | p99 (us) | Integrity |
        |------|-----------:|----:|--------:|---------:|---------:|-----------|
        | 0-1  |            |     |         |          |          |           |
        | 1-2  |            |     |         |          |          |           |
        | 2-3  |            |     |         |          |          |           |
        | 3-0  |            |     |         |          |          |           |
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Qualification command
      description: >-
        The exact `qualify_direct_cable.py` invocation (or whatever you ran
        instead), verbatim then redacted.
      render: shell
    validations:
      required: true

  - type: textarea
    id: qualification_json
    attributes:
      label: Qualification output
      description: >-
        Attach the JSON document from `--output` (drag the file in), or paste
        it here. Include the exit code. Reviewers read `cable_qualified`,
        `latency_target_met`, `model_path_ready`, `failure_domain`, and
        `counter_deltas` — a good median with any new CRC/drop counter is an
        integrity failure, not a pass.
      render: json
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: >-
        Anything that would help someone reproduce this, or anything that
        surprised you. If you had to change something in the repo to get this
        far, say what.
