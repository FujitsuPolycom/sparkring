name: Regression
description: Report a correctness, validation, or performance regression in a supported profile.
title: "[regression] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Provide comparable before and after evidence. Different profiles,
        images, hardware, or measurement windows are observations rather than
        sealed A/B regressions; identify those differences explicitly.
        Redact private identifiers from all attachments.

  - type: dropdown
    id: profile
    attributes:
      label: Supported profile
      options:
        - GLM-5.2 EXL3 3.5-bpw — R7 runtime
        - DeepSeek-V4-Flash-0731 — published serving image
        - Both supported profiles
        - Neither profile — offline tooling
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Current status
      options:
        - implemented
        - qualified
        - research-only
        - unsupported
    validations:
      required: true

  - type: checkboxes
    id: sanitized
    attributes:
      label: Sanitization
      options:
        - label: I redacted IPs, hostnames, accounts, absolute host paths, credentials, and private image names.
          required: true

  - type: input
    id: good
    attributes:
      label: Last known-good commit, tag, image, or model identity
    validations:
      required: true

  - type: input
    id: bad
    attributes:
      label: First known-bad commit, tag, image, or model identity
    validations:
      required: true

  - type: textarea
    id: before
    attributes:
      label: Before
      description: Exact command and output or measurement, including units, rank layout, context, concurrency, and window.
      render: shell
    validations:
      required: true

  - type: textarea
    id: after
    attributes:
      label: After
      description: The same command and conditions on the bad revision or identity.
      render: shell
    validations:
      required: true

  - type: textarea
    id: held_constant
    attributes:
      label: Conditions held constant
      value: |
        - Profile:
        - Four-rank layout:
        - Image and model identity:
        - Hardware and drivers:
        - Environment and flags:
        - Anything not held constant:
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Validation class
      description: Distinguish the consolidated offline Python suites from four-rank live validation. State host authorization for any mutation or serving interruption.
      value: |
        - Offline suites: (spark_transport, runtime/exl3-r7, runtime/test_public_overlay.py, performance/harnesses, scripts)
        - Four-rank live validation: (passed / failed / not run)
        - Hosts and explicit authorization for MUTATES HOST or STOPS SERVING:
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence bundle
      description: Attach machine-readable output, logs, counters, and performance records. State conditions, measurement, result, conclusion, and limitations.
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
