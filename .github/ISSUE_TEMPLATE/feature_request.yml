name: Idea or feature request
description: Suggest an improvement to SparkRing.
title: "[idea] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. A complete design or access to Spark hardware is not required.

  - type: textarea
    id: problem
    attributes:
      label: What would you like to improve?
      description: Describe the problem, limitation, or use case.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Suggested approach
      description: Share an approach if you have one. This field is optional.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, alternatives, links, or hardware details if relevant.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I may be willing to help implement or test this.
