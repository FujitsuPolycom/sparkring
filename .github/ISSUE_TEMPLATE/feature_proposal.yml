name: Feature proposal
description: Propose repository behavior for a supported profile or measurement surface.
title: "[proposal] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        SparkRing supports two serving configurations:
        - GLM-5.2 EXL3 3.5-bpw with the R7 runtime and site/candidate contracts.
        - DeepSeek-V4-Flash-0731 with the published serving image and per-rank environment contract.

        Proposals must describe observable behavior, evidence, and the condition
        that would make the proposal unsupported.

  - type: dropdown
    id: profile
    attributes:
      label: Supported profile
      options:
        - GLM-5.2 EXL3 3.5-bpw — R7 runtime
        - DeepSeek-V4-Flash-0731 — published serving image
        - Both supported profiles
        - Neither profile — repository tooling or documentation
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Intended status
      options:
        - implemented
        - qualified
        - research-only
        - unsupported
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What observable problem does this solve, and for which profile?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Repository area
      options:
        - spark_transport — transport and four-rank serving integration
        - runtime — R7 runtime and image identity pins
        - scripts — profile configuration and validation
        - performance — measurement harnesses and evidence
        - docs — supported profile documentation
        - CI / repository tooling
        - Other
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: State the interface, surviving paths, invariants, and profile-specific behavior.
    validations:
      required: true

  - type: textarea
    id: evidence_plan
    attributes:
      label: Evidence plan
      value: |
        - Offline Python suite(s):
        - Four-rank live validation, if required:
        - Measurement, units, and configuration label:
        - Evidence artifact:
        - Result that would make the proposal unsupported:
    validations:
      required: true

  - type: textarea
    id: safety
    attributes:
      label: Release and host safety
      description: Identify release-safety impact and any host mutation or serving interruption.
      value: |
        - Release-safety impact:
        - Hosts and explicit authorization for MUTATES HOST or STOPS SERVING actions:
        - Rollback or refusal condition:
    validations:
      required: true

  - type: textarea
    id: provenance
    attributes:
      label: Provenance
      description: Name any source project, URL/commit, license, and copied or adapted ideas. Write "original work" if applicable.
    validations:
      required: true

  - type: checkboxes
    id: intent
    attributes:
      label: Contribution intent
      options:
        - label: I am willing to implement this.
        - label: I have access to the hardware needed for four-rank live validation.
