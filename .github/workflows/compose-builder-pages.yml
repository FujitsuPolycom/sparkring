name: Install Builder pages

# Publishes the Install Builder (docs/operations/compose-builder.md) to the
# repository's GitHub Pages site for a tag or commit: each published release
# that is not a prerelease, or one named by hand. Deploying needs Pages enabled
# with GitHub Actions as its source. The github-pages environment deploys only
# from main, and a release event runs on its tag, so the release job starts this
# workflow again on main with the tag as its input; the page itself is built
# from the input's tree. The page is built with --verify, so a page whose engine
# differs from compose.build is never published. When the repository variable
# INSTALL_BUILDER_USAGE_COUNTER holds a GoatCounter count endpoint
# (https://NAME.goatcounter.com/count), the page counts its views and the output
# visitors take from it (docs/operations/compose-builder.md#usage-counts); without
# the variable it sends nothing.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or commit to build the page from
        required: true

permissions:
  contents: read

concurrency:
  group: compose-builder-pages-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  start-on-main:
    name: start on main
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Run this workflow on main for the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh workflow run compose-builder-pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f ref="$TAG"

  build:
    name: build and verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install the page's build dependency
        run: python -m pip install PyYAML==6.0.3
      # The page names and pins the checkout's exact release tag when it has one, else its commit.
      - name: Build the page, comparing its engine with compose.build
        env:
          USAGE_COUNTER: ${{ vars.INSTALL_BUILDER_USAGE_COUNTER }}
          REF: ${{ inputs.ref }}
        # A source older than --usage-counter builds a page that counts nothing.
        run: |
          args=(--output site --verify --cases 20)
          if [ -n "$USAGE_COUNTER" ]; then
            if python scripts/generate_compose_builder.py --help | grep -q -- --usage-counter; then
              args+=(--usage-counter "$USAGE_COUNTER")
            else
              echo "::warning::$REF predates --usage-counter; the page counts nothing"
            fi
          fi
          python scripts/generate_compose_builder.py "${args[@]}"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
