name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  TORCH_VERSION: "2.11.0"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install development tools
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Lint maintained Python trees
        run: ruff check --select E,F,W --ignore E501 spark_transport runtime scripts performance integrations/lil

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements-dev.txt', '.github/workflows/ci.yml') }}
          restore-keys: |
            pip-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-
      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==${TORCH_VERSION}"
      - name: Test maintained Python trees
        run: python -m pytest spark_transport runtime/exl3-r7 runtime/glm53-flash runtime/glm53-flash-jj-r8-gb10 runtime/glm53-spark-mtp3-mesh runtime/deepseek0731-gb10 runtime/qwen38 runtime/sparkring runtime/test_public_overlay.py performance/harnesses scripts integrations/lil -q -rs

  lil-bridge:
    name: pinned LIL bridge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: FujitsuPolycom/lil
          ref: 329cde801b847294005cb16765692032a6cdf206
          path: .lil-companion
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache-dependency-path: .lil-companion/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build and test companion lifecycle
        working-directory: .lil-companion
        run: |
          go test ./...
          go vet ./...
          go build -o "$RUNNER_TEMP/lil" ./cmd/lil
      - name: Test both SparkRing profiles against the pinned CLI
        env:
          LIL_TEST_BINARY: ${{ runner.temp }}/lil
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          test -x "$LIL_TEST_BINARY"
          python -m pytest integrations/lil -q -rs

  docs-links:
    name: docs links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Check repo-relative Markdown links and anchors
        run: python scripts/check_markdown_links.py .

  release-safety:
    name: release safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Scan tracked files without disclosing matched content
        run: python scripts/check_release_safety.py .
