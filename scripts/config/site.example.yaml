# =============================================================================
# SparkRing site configuration - EXAMPLE / TEMPLATE
# =============================================================================
#
# Copy this file to scripts/config/site.yaml and replace EVERY value with the
# ones that describe your own four-node cluster.  Nothing in this file is a
# working value: it exists so that `python scripts/sparkring_site.py` and
# `python scripts/preflight.py` have a complete, schema-valid example to
# validate against.
#
# Validate your copy before you use it:
#
#     python scripts/sparkring_site.py scripts/config/site.yaml
#
# Run the read-only cluster preflight against it:
#
#     python scripts/preflight.py --site scripts/config/site.yaml
#
# -----------------------------------------------------------------------------
# ABOUT THE PLACEHOLDER ADDRESSES
# -----------------------------------------------------------------------------
# Every IPv4 address below comes from an IANA-reserved, never-routable range so
# that this file can never collide with a real network:
#
#   192.0.2.0/24     TEST-NET-1      (RFC 5737, documentation)
#   198.51.100.0/24  TEST-NET-2      (RFC 5737, documentation)
#   203.0.113.0/24   TEST-NET-3      (RFC 5737, documentation)
#   198.18.0.0/15    BENCHMARKING    (RFC 2544, reserved for test equipment)
#
# A four-node ring needs four distinct ring /24s plus one management /24, and
# RFC 5737 only defines three /24s, so the remaining two subnets are taken from
# the RFC 2544 benchmarking block.  `sparkring_site.py` warns whenever it sees
# an address from any of these ranges - if the preflight tells you your site
# still uses documentation addresses, you have not finished filling this in.
#
# Every sha256 placeholder below is a single repeated hex digit (aaaa..., bbbb...)
# so it is obviously fake but still schema-valid.  The loader warns about those
# too.
# =============================================================================

schema_version: 1

# -----------------------------------------------------------------------------
# site: free-form identification, carried into the preflight evidence file.
# -----------------------------------------------------------------------------
site:
  # Short machine-friendly name. Appears in evidence JSON and log output.
  name: example-4-node-ring
  # One line of human context: rack, room, owner, purpose.
  description: Example four-node DGX Spark ring - REPLACE with your own site.

# -----------------------------------------------------------------------------
# topology: the physical 200GbE ring.
#
# Four nodes, four cables, one closed 4-cycle:
#
#        r0-r1
#   rank0 ----- rank1
#     |            |
#   r3-r0        r1-r2
#     |            |
#   rank3 ----- rank2
#        r2-r3
#
# Each cable ("edge") is its own point-to-point /24 carrying exactly two
# addresses - one per endpoint.  The validator rejects any edge map that is not
# a single closed cycle through all four ranks, so a mis-cabled pair (say two
# cables between rank0 and rank1 and two between rank2 and rank3) fails at load
# time instead of at NCCL init time.
# -----------------------------------------------------------------------------
topology:
  # MTU configured on every ring interface. 9000 = standard jumbo frames.
  # Derive: `cat /sys/class/net/<ring-if>/mtu` on each node - all eight ring
  # ports must agree, and the switch/DAC path must carry it end to end.
  # preflight.py pings with a payload of (mtu - 28) and the DF bit set, so a
  # path that silently fragments shows up as a failure rather than as slow
  # collectives later.
  mtu: 9000

  # Negotiated link speed in Mb/s that every ring port must report.
  # Derive: `cat /sys/class/net/<ring-if>/speed` (200000 for 200GbE).
  # This is an *expectation*, not a setting: a cable that trained down to
  # 100GbE reports 100000 here and fails preflight.
  link_speed_mbps: 200000

  edges:
    # id:        any unique label; used in output and to join ranks to edges.
    # subnet:    an unused, mutually distinct /24 per cable. It never needs to
    #            route anywhere - it only has to be unique on your nodes and
    #            not overlap the management network.
    # endpoints: the two rank ids joined by this cable.
    - id: r0-r1
      subnet: 192.0.2.0/24
      endpoints: [0, 1]
    - id: r1-r2
      subnet: 198.51.100.0/24
      endpoints: [1, 2]
    - id: r2-r3
      subnet: 203.0.113.0/24
      endpoints: [2, 3]
    - id: r3-r0
      subnet: 198.18.0.0/24
      endpoints: [3, 0]

# -----------------------------------------------------------------------------
# ranks: exactly four entries, ids 0..3.
#
# HOW TO DERIVE THE NON-OBVIOUS FIELDS (run these on each node):
#
#   interface names
#     ip -br link                       # every netdev and its state
#     ls /sys/class/net                 # same, terser
#     Names are firmware/udev dependent - yours will not look like the
#     eth0/eth1/eth2 placeholders below. Pick the two that are your 200GbE
#     ports and the one that actually holds your management address.
#
#   which netdev belongs to which RDMA device
#     ls -l /sys/class/infiniband/*/device/net/     # device -> netdev
#     rdma link show                                # or, if installed:
#     ibdev2netdev
#     A dual-port card usually presents one verbs device per port
#     (mlx5_0, mlx5_1) or one device with two ports - see rdma_port below.
#
#   rdma_port
#     ls /sys/class/infiniband/<device>/ports/      # usually just "1"
#     Use 2 only if your card exposes both physical ports under one device.
#
#   roce_gid_index
#     dev=<device>; port=<rdma_port>
#     for i in $(seq 0 15); do
#       printf '%2s %s %s\n' "$i" \
#         "$(cat /sys/class/infiniband/$dev/ports/$port/gids/$i)" \
#         "$(cat /sys/class/infiniband/$dev/ports/$port/gid_attrs/types/$i)"
#     done
#     Pick the index whose type is "RoCE v2" AND whose GID is the IPv4-mapped
#     form of that port's ring address:
#         192.0.2.10  ->  0000:0000:0000:0000:0000:ffff:c000:020a
#     (each dotted octet becomes two hex digits in the last two groups).
#     preflight.py recomputes that mapping and compares, so a card whose GID
#     table shifted after a driver upgrade fails loudly instead of silently
#     picking a RoCEv1 or link-local GID.
#
#   management interface
#     ip -o -4 addr | grep <your-management-ip>
#     This MUST be the interface that really holds the address - not the one
#     you believe holds it. A management NIC that quietly stops holding its
#     address (a Wi-Fi adapter that fails to re-associate after a reboot is the
#     classic case) breaks the collective bootstrap in a way that is very hard
#     to attribute after the fact. Prefer a wired interface.
# -----------------------------------------------------------------------------
ranks:
  - id: 0
    # ssh target used by preflight. Key-based auth only: preflight runs ssh
    # with BatchMode=yes and will not prompt for a password.
    ssh_target: operator@198.18.1.10
    management:
      interface: eth0
      address: 198.18.1.10
    ring_ports:
      - edge: r0-r1
        interface: eth1
        address: 192.0.2.10
        rdma_device: mlx5_0
        rdma_port: 1
        roce_gid_index: 3
      - edge: r3-r0
        interface: eth2
        address: 198.18.0.10
        rdma_device: mlx5_1
        rdma_port: 1
        roce_gid_index: 3
    # Control-channel rendezvous addresses for this rank's two ring neighbours.
    # Bulk tensor traffic rides RDMA on the ring subnets above; these TCP
    # addresses are only used to bootstrap the native TP4 / vocab / DCP
    # sessions. They are normally the neighbours' management addresses, but may
    # be a dedicated control network. The validator requires that the two peer
    # *ranks* are exactly this rank's ring neighbours, so a stale peer table
    # that points at the wrong node cannot load.
    transport_peers:
      - rank: 1
        address: 198.18.1.11
      - rank: 3
        address: 198.18.1.13

  - id: 1
    ssh_target: operator@198.18.1.11
    management:
      interface: eth0
      address: 198.18.1.11
    ring_ports:
      - edge: r0-r1
        interface: eth1
        address: 192.0.2.11
        rdma_device: mlx5_0
        rdma_port: 1
        roce_gid_index: 3
      - edge: r1-r2
        interface: eth2
        address: 198.51.100.11
        rdma_device: mlx5_1
        rdma_port: 1
        roce_gid_index: 3
    transport_peers:
      - rank: 0
        address: 198.18.1.10
      - rank: 2
        address: 198.18.1.12

  - id: 2
    ssh_target: operator@198.18.1.12
    management:
      interface: eth0
      address: 198.18.1.12
    ring_ports:
      - edge: r1-r2
        interface: eth1
        address: 198.51.100.12
        rdma_device: mlx5_0
        rdma_port: 1
        roce_gid_index: 3
      - edge: r2-r3
        interface: eth2
        address: 203.0.113.12
        rdma_device: mlx5_1
        rdma_port: 1
        roce_gid_index: 3
    transport_peers:
      - rank: 1
        address: 198.18.1.11
      - rank: 3
        address: 198.18.1.13

  - id: 3
    ssh_target: operator@198.18.1.13
    management:
      interface: eth0
      address: 198.18.1.13
    ring_ports:
      - edge: r2-r3
        interface: eth1
        address: 203.0.113.13
        rdma_device: mlx5_0
        rdma_port: 1
        roce_gid_index: 3
      - edge: r3-r0
        interface: eth2
        address: 198.18.0.13
        rdma_device: mlx5_1
        rdma_port: 1
        roce_gid_index: 3
    transport_peers:
      - rank: 2
        address: 198.18.1.12
      - rank: 0
        address: 198.18.1.10

# -----------------------------------------------------------------------------
# runtime: the exact, immutable software and weights every rank must be running.
#
# The point of pinning digests here is that preflight can prove all four nodes
# agree *before* anything is launched. Drift between ranks is the single most
# expensive failure mode in a four-node run.
# -----------------------------------------------------------------------------
runtime:
  # Container image reference as it appears in the local image store.
  container_image: registry.example/your-org/your-runtime:0.0.0-REPLACE

  # Immutable digest for that image. preflight accepts a match against either
  # the local image ID or any of the image's registry RepoDigests.
  # Derive (local image ID):
  #     docker image inspect <ref> --format '{{.Id}}'
  # Derive (registry digest, if the image was pulled):
  #     docker image inspect <ref> --format '{{json .RepoDigests}}'
  container_image_digest: sha256:1111111111111111111111111111111111111111111111111111111111111111

  # Absolute path to the weights *inside the container*.
  model_path: /models/your-model

  # Upstream repository the weights came from (informational; recorded in
  # evidence so a run can be traced back to a source).
  model_repo: your-org/your-model

  # Immutable revision of that repository: a 40-hex commit sha, never a branch
  # or tag name.  Derive: `git -C <clone> rev-parse HEAD`, or read the commit
  # sha from your model host's revision metadata.
  model_revision: "0000000000000000000000000000000000000000"

  # sha256 of the checkpoint artifact you treat as authoritative (for example
  # the safetensors index or your own manifest file). Every rank is expected to
  # resolve to this same value.
  # Derive: `sha256sum <checkpoint-manifest>`
  checkpoint_sha256: ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff

# -----------------------------------------------------------------------------
# serving: the engine shape. These are recorded in evidence and cross-checked
# for internal consistency (tensor parallel size must be divisible by the
# decode-context-parallel size, and so on).
# -----------------------------------------------------------------------------
serving:
  # Tensor-parallel width. On a four-node ring this is normally 4.
  tensor_parallel_size: 4

  # Decode-context-parallel width. Must divide tensor_parallel_size.
  # 1 disables DCP sharding; 4 shards the decode context across all four ranks.
  decode_context_parallel_size: 4

  # Multi-token-prediction mode: off | static | adaptive
  mtp_mode: adaptive

  # Speculative tokens per step. Must be 0 when mtp_mode is "off".
  mtp_tokens: 2

  # Maximum context length the engine will admit.
  max_model_len: 131072

  # KV cache budget per rank, in bytes. Derive from your per-GPU memory budget
  # minus weights and activation headroom. 68719476736 = 64 GiB.
  kv_cache_bytes_per_rank: 68719476736

  # Maximum concurrent sequences.
  max_num_seqs: 8

  # Rank that hosts the OpenAI-compatible API and the distributed rendezvous.
  master_rank: 0

  # API port on master_rank.
  api_port: 8000

  # Distributed rendezvous port on master_rank.
  master_port: 29500

# -----------------------------------------------------------------------------
# paths: where caches live on the nodes, and where evidence lands locally.
# -----------------------------------------------------------------------------
paths:
  # Remote, per-rank. JIT / compile cache directory.
  jit_cache_dir: /var/lib/sparkring/jit-cache

  # Remote, per-rank. Persistent context (KV) cache directory.
  context_cache_dir: /var/lib/sparkring/context-cache

  # LOCAL, on the machine running preflight.py. Evidence JSON is written here
  # when --json is not given explicitly. May be relative.
  evidence_dir: ./evidence

  # Minimum free space preflight requires at each remote path, in bytes.
  # Set these from your own working-set size; the values below are examples.
  min_free_bytes:
    jit_cache: 34359738368        # 32 GiB
    context_cache: 549755813888   # 512 GiB

# -----------------------------------------------------------------------------
# artifacts: files that must exist on every rank, byte-for-byte identical.
#
# These are the pinned binaries the run depends on - the transport library, the
# collective library, and any probe executables. preflight hashes each one on
# every node and fails if a single byte differs, which is how you catch "rank 2
# is still running last week's build".
#
# Derive: `sha256sum <path>` on a node you trust, then paste the hash here.
# Set `executable: true` for anything that must carry the +x bit.
# -----------------------------------------------------------------------------
artifacts:
  - name: transport_library
    path: /opt/sparkring/lib/libspark_transport_capi.so
    sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    executable: false

  - name: nccl_library
    path: /opt/sparkring/lib/libnccl.so.2
    sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    executable: false

  - name: tp4_graph_probe
    path: /opt/sparkring/bin/spark_tp4_graph_probe
    sha256: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
    executable: true

  - name: tp4_vocab_graph_probe
    path: /opt/sparkring/bin/spark_tp4_vocab_graph_probe
    sha256: dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
    executable: true

  - name: tp4_dcp_graph_probe
    path: /opt/sparkring/bin/spark_tp4_dcp_graph_probe
    sha256: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
    executable: true

# -----------------------------------------------------------------------------
# preflight: knobs for the read-only checker itself.
# -----------------------------------------------------------------------------
preflight:
  # Per-rank ssh timeout, seconds.
  ssh_timeout_seconds: 45

  # Ports that must have NO listener on every rank before a launch.
  # IMPORTANT: leave this list empty ([]) when you are checking a cluster that
  # is already serving - the API and rendezvous ports are legitimately bound in
  # that case and the check would fail by design.
  required_free_ports: [8000, 29500]
