# =============================================================================
# SparkRing EXL3 R7 site configuration - EXAMPLE / TEMPLATE
# =============================================================================
#
# This is the EXL3 3.5-bpw foundation site template. Copy it to site.yaml and
# replace every placeholder. The serving values are the reproducible 65K
# foundation for the operator-accepted 262K profile whose recipe ID is R7:
# TP4, DCP4, fixed MTP4, 9.25 GB KV/rank, fp8_ds_mla, 65536 max model len.
#
# Validate your copy before use:
#
#     python scripts/sparkring_site.py scripts/config/site.yaml
#     python scripts/preflight.py --site scripts/config/site.yaml --print-plan
#
# See docs/EXL3_R7_QUICKSTART.md for the full stand-up path.
# =============================================================================

schema_version: 1

site:
  name: exl3-r7-4-node-ring
  description: Example four-node DGX Spark ring for the R7 3.5-bpw candidate - REPLACE.

topology:
  mtu: 9000
  link_speed_mbps: 200000
  edges:
    - id: r0-r1
      subnet: 192.0.2.0/24
      endpoints: [0, 1]
    - id: r1-r2
      subnet: 198.51.100.0/24
      endpoints: [1, 2]
    - id: r2-r3
      subnet: 203.0.113.0/24
      endpoints: [2, 3]
    - id: r3-r0
      subnet: 198.18.0.0/24
      endpoints: [3, 0]

ranks:
  - id: 0
    ssh_target: operator@198.18.1.10
    management:
      interface: eth0
      address: 198.18.1.10
    ring_ports:
      - edge: r0-r1
        interface: eth1
        address: 192.0.2.10
        rdma_device: mlx5_0
        rdma_port: 1
        roce_gid_index: 3
      - edge: r3-r0
        interface: eth2
        address: 198.18.0.10
        rdma_device: mlx5_1
        rdma_port: 1
        roce_gid_index: 3
    transport_peers:
      - rank: 1
        address: 198.18.1.11
      - rank: 3
        address: 198.18.1.13

  - id: 1
    ssh_target: operator@198.18.1.11
    management:
      interface: eth0
      address: 198.18.1.11
    ring_ports:
      - edge: r0-r1
        interface: eth1
        address: 192.0.2.11
        rdma_device: mlx5_0
        rdma_port: 1
        roce_gid_index: 3
      - edge: r1-r2
        interface: eth2
        address: 198.51.100.11
        rdma_device: mlx5_1
        rdma_port: 1
        roce_gid_index: 3
    transport_peers:
      - rank: 0
        address: 198.18.1.10
      - rank: 2
        address: 198.18.1.12

  - id: 2
    ssh_target: operator@198.18.1.12
    management:
      interface: eth0
      address: 198.18.1.12
    ring_ports:
      - edge: r1-r2
        interface: eth1
        address: 198.51.100.12
        rdma_device: mlx5_0
        rdma_port: 1
        roce_gid_index: 3
      - edge: r2-r3
        interface: eth2
        address: 203.0.113.12
        rdma_device: mlx5_1
        rdma_port: 1
        roce_gid_index: 3
    transport_peers:
      - rank: 1
        address: 198.18.1.11
      - rank: 3
        address: 198.18.1.13

  - id: 3
    ssh_target: operator@198.18.1.13
    management:
      interface: eth0
      address: 198.18.1.13
    ring_ports:
      - edge: r2-r3
        interface: eth1
        address: 203.0.113.13
        rdma_device: mlx5_0
        rdma_port: 1
        roce_gid_index: 3
      - edge: r3-r0
        interface: eth2
        address: 198.18.0.13
        rdma_device: mlx5_1
        rdma_port: 1
        roce_gid_index: 3
    transport_peers:
      - rank: 2
        address: 198.18.1.12
      - rank: 0
        address: 198.18.1.10

runtime:
  # Replace with your locally built ARM64 image reference.
  container_image: sparkring/glm52-exl3-r7-3.5bpw:REPLACE
  # Replace with your local image ID (docker image inspect <ref> --format '{{.Id}}').
  container_image_digest: sha256:1111111111111111111111111111111111111111111111111111111111111111
  model_path: /models/glm52-exl3-r7-3.5bpw
  model_repo: brandonmusic/GLM-5.2-EXL3-TR3v4-3.5bpw-MTP78
  model_revision: "9ab9579774cc432df91567a36f6e9e863e0d4c9f"
  checkpoint_sha256: 9fd852f69ed64442e31dce1cbc5fe7acd0a76bfb848e945d272fe98d00d0c9cd

# R7 candidate serving contract: fixed MTP4, DCP4, 9.25 GB KV/rank, fp8_ds_mla.
# The MTP3 rollback uses mtp_tokens: 3 and kv_cache_bytes_per_rank: 9250000000.
serving:
  tensor_parallel_size: 4
  decode_context_parallel_size: 4
  mtp_mode: "static"
  mtp_tokens: 4
  max_model_len: 65536
  kv_cache_bytes_per_rank: 9250000000
  max_num_seqs: 8
  master_rank: 0
  api_port: 8000
  master_port: 29500

paths:
  jit_cache_dir: /var/lib/sparkring/jit-cache
  context_cache_dir: /var/lib/sparkring/context-cache
  evidence_dir: ./evidence
  min_free_bytes:
    jit_cache: 34359738368
    context_cache: 549755813888

# The runtime files this profile depends on are baked into the image and
# verified from its in-image runtime manifest before vLLM starts, so there
# is nothing on the host for preflight to hash. Host artifacts belong here
# only when a deployment stages a file outside the image, and each entry
# must name a path something actually writes.
artifacts: []

preflight:
  ssh_timeout_seconds: 45
  required_free_ports: [8000, 29500]
