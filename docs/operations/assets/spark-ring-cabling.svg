<svg xmlns="http://www.w3.org/2000/svg" width="900" height="800" viewBox="0 0 900 800" role="img" aria-labelledby="title desc">
<!-- Schematic of the back of an NVIDIA DGX Spark, seen facing the rear ports; not to scale. QSFP port p0 (Linux enp1s0f0np0 and enP2p1s0f0np0) is the left cage and p1 (enp1s0f1np1 and enP2p1s0f1np1) is the right cage. NVIDIA documents p0 as the left cage, next to the RJ-45 port: DGX Spark User Guide, ConnectX-7 Networking, Full Correspondence Table, https://docs.nvidia.com/dgx/dgx-spark/spark-clustering.html -->
<title id="title">DGX Spark four-node ring cabling</title>
<desc id="desc">Four DGX Sparks seen from the back, stacked top to bottom as Spark 0 (Node A), Spark 1, Spark 2 and Spark 3. QSFP DAC cables connect Spark 0 p0 to Spark 1 p1, Spark 1 p0 to Spark 2 p1, Spark 2 p0 to Spark 3 p1, and Spark 3 p0 back to Spark 0 p1 along the right side. p0 is the left QSFP cage, next to the 10GbE port. Only Spark 0's 10GbE port connects to your network.</desc>
<rect x="1" y="1" width="898" height="798" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<line x1="490" y1="122" x2="490" y2="45" stroke="#ffffff" stroke-width="7"/><line x1="490" y1="122" x2="490" y2="45" stroke="#57606a" stroke-width="3"/><path d="M484,47 L490,38 L496,47 Z" fill="#57606a"/><text x="490" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1f2328">to your network</text>
