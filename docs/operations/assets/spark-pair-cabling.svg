<text x="450" y="392" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#57606a">Back of a two-Spark pair: one cable from p0 to p0</text>
