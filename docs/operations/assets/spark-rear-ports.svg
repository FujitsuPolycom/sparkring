troke="#32383f" stroke-width="1.5"/><rect x="527" y="54" width="110" height="34" rx="2" fill="#16191d"/><text x="582" y="77.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#ffffff">p0</text><rect x="643" y="54" width="110" height="34" rx="2" fill="#16191d"/><text x="698" y="77.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#ffffff">p1</text></g>
