<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
<!-- Schematic of the back of an NVIDIA DGX Spark, seen facing the rear ports; not to scale. QSFP port p0 (Linux enp1s0f0np0 and enP2p1s0f0np0) is the left cage and p1 (enp1s0f1np1 and enP2p1s0f1np1) is the right cage. NVIDIA documents p0 as the left cage, next to the RJ-45 port: DGX Spark User Guide, ConnectX-7 Networking, Full Correspondence Table, https://docs.nvidia.com/dgx/dgx-spark/spark-clustering.html -->
<title id="title">Back of a DGX Spark</title>
<desc id="desc">Rear panel of an NVIDIA DGX Spark, left to right: power button, USB-C power input, three USB-C ports, HDMI, 10GbE RJ-45 port for your network, and two QSFP ports. QSFP port p0 is the left QSFP cage, next to the 10GbE port (interfaces enp1s0f0np0 and enP2p1s0f0np0); p1 is the other cage (enp1s0f1np1 and enP2p1s0f1np1).</desc>
<rect x="1" y="1" width="898" height="298" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
